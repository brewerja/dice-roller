[project]
name = "dice-roller"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "redis>=8.1.0",
    "jinja2>=3.1.6",
    "nh3>=0.3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "complexipy>=8.1.0",
    "fakeredis>=2.40.0",
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 10
