<!DOCTYPE html>
<html lang="en">
<head>
    <title>Rolling Room</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
/* Larger text on bigger screens, as on the room page. */
@media (min-width: 576px) { html { font-size: 1.5rem; } }
    </style>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-dark">
<div class="container-sm d-flex flex-column py-2 gap-2">
    <h1 class="text-light fs-4 mb-0">Rolling Room</h1>
    <div class="text-light small">Pick a room below, or go to /rooms/<em>name</em> to start a new one.</div>
    {% if rooms %}
    <div class="list-group">
        {% for room in rooms %}
        <a href="/rooms/{{ room|urlencode }}" class="list-group-item list-group-item-action">{{ room }}</a>
        {% endfor %}
    </div>
    {% else %}
    <div class="text-light">No rooms yet.</div>
    {% endif %}
</div>
</body>
</html>
