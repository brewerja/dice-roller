<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{ room_id }} — Rolling Room</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
    <script>var roomId = "{{ room_id }}";</script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
            integrity="sha384-fgGyf7Mo7DURSOMnOy7ed+dkq5Job205Gnzu6QIg0BOHKaqt4D76Dt8VlDCzcMHV" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    <script src="/static/dieroll.js"></script>

    <style>
/* Fill the screen: header and controls at their natural size, the roll list takes the rest.
   dvh follows the phone's address bar as it shows and hides; vh is the fallback. */
body { height: 100vh; height: 100dvh; }
#rollContainer { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
#rollList li.mine { box-shadow: inset 0.35rem 0 0 var(--bs-warning); }

/* Larger text on bigger screens. Phones keep 16px, which also stops iOS zooming in on inputs. */
@media (min-width: 576px) { html { font-size: 1.5rem; } }
    </style>

    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body class="bg-dark">
<noscript>
    <h2 style="color: #ff0000">Seems your browser doesn't support
        Javascript! Websocket relies on Javascript being enabled. Please
        enable Javascript and reload this page!</h2>
</noscript>
<div class="container-sm d-flex flex-column h-100 py-2 gap-2">
    <div class="d-flex align-items-center gap-2">
        <h1 class="text-light fs-4 mb-0 text-truncate"><span class="d-none d-sm-inline">Room: </span>{{ room_id }}</h1>
        <span id="connStatus" title="Connecting…" class="text-warning">&#9679;</span>
        <input type="text" class="form-control ms-auto flex-shrink-0" id="name" placeholder="Name" style="width: 8rem;">
    </div>
    <div id="connText" class="text-warning small">Connecting…</div>
    <div class="border rounded" id="rollContainer">
        <ul class="list-group list-group-flush" id="rollList">
        </ul>
    </div>
    <div class="d-flex gap-2">
        <button id="roll2d6" type="button" title="Roll d6,d6 (or press R)" class="btn btn-lg btn-danger flex-fill flex-sm-grow-0 px-sm-5">d6,d6</button>
        <button id="rolld20" type="button" title="Roll d20 (or press B)" class="btn btn-lg btn-primary flex-fill flex-sm-grow-0 px-sm-5">d20</button>
        <button id="rolld6" type="button" title="Roll d6 (or press G)" class="btn btn-lg btn-success flex-fill flex-sm-grow-0 px-sm-5">d6</button>
    </div>
    <input type="text" class="form-control form-control-lg" id="message" placeholder="Chat, or roll e.g. d8,d12"
           enterkeyhint="send" autocomplete="off">
</div>
</body>
</html>
