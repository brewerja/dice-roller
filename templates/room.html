<!DOCTYPE html>
<html lang="en">
<head>
    <title>Rolling Room</title>
    <script>var roomId = "{{ room_id }}";</script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
            integrity="sha384-fgGyf7Mo7DURSOMnOy7ed+dkq5Job205Gnzu6QIg0BOHKaqt4D76Dt8VlDCzcMHV" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    <script src="/static/dieroll.js"></script>

    <style>
@supports (-webkit-touch-callout: none) {
/* CSS specific to iOS devices */
div#rollContainer { overflow-y : scroll; height : calc(100vh - 500px);}
}

@supports not (-webkit-touch-callout: none) {
/* CSS for other than iOS devices */
div#rollContainer { overflow-y : scroll; height : calc(100vh - 298px);}
}

html {font-size: 1.5rem;}
    </style>

    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body class="d-flex bg-dark">
<noscript>
    <h2 style="color: #ff0000">Seems your browser doesn't support
        Javascript! Websocket relies on Javascript being enabled. Please
        enable Javascript and reload this page!</h2>
</noscript>
<div class="container-sm">
    <h1 class="text-light">Room: {{ room_id }} <span id="connStatus" title="Connecting..." class="text-warning" style="font-size:0.6em;">&#9679;</span></h1>
    <div class="row">
        <div class="input-group input-group-lg">
            <div class="input-group-prepend">
                <div class="btn-toolbar" role="toolbar">
                    <div class="btn-group btn-group-lg me-2">
                        <button id="roll2d6" type="button" class="btn btn-danger">d6,d6</button>
                    </div>
                    <div class="btn-group btn-group-lg me-2">
                        <button id="rolld20" type="button" class="btn btn-primary">d20</button>
                    </div>
                    <div class="btn-group btn-group-lg me-2">
                        <button id="rolld6" type="button" class="btn btn-success">d6</button>
                    </div>
                </div>
            </div>
            <input type="text" class="form-control rounded" id="name" placeholder="Name"></input>
        </div>
    </div>
    <div class="my-2 border rounded" id="rollContainer">
        <div id="loading" class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <ul class="list-group" id="rollList">
        </ul>
    </div>
    <div class="form-group">
        <div class="input-group input-group-lg">
            <input type="text" class="form-control rounded" id="message" placeholder="Chat here...">
        </div>
    </div>
</div>
</body>
</html>
